<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga X - قارئ المانجا</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: '#FF2E93', darkBg: '#0F172A', cardBg: '#1E293B' } } }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen">

    <nav class="p-4 bg-cardBg border-b border-slate-800 flex justify-between items-center sticky top-0 z-50">
        <a href="index.html" class="text-primary font-bold flex items-center gap-2">
            <i class="fa-solid fa-arrow-right"></i> العودة للرئيسية
        </a>
        <h1 id="mangaTitleDisplay" class="font-bold text-lg text-slate-200">جاري التحميل...</h1>
    </nav>

    <main class="max-w-4xl mx-auto p-4 space-y-6">
        <div id="mangaDetails" class="bg-cardBg p-6 rounded-2xl border border-slate-800 flex flex-col md:flex-row gap-6">
            <!-- التفاصيل ستظهر هنا -->
        </div>

        <div class="bg-cardBg p-6 rounded-2xl border border-slate-800 space-y-4">
            <h3 class="text-xl font-bold border-r-4 border-primary pr-3">الفصول المتاحة</h3>
            <div id="chaptersList" class="grid grid-cols-1 gap-2">
                <p class="text-slate-400">لا توجد فصول مضافة بعد.</p>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCiHNEcRyiV9Siy5sB1dHTBcypMJMorF2Q",
          authDomain: "mangax-18232.firebaseapp.com",
          projectId: "mangax-18232",
          storageBucket: "mangax-18232.firebasestorage.app",
          messagingSenderId: "852304213792",
          appId: "1:852304213792:web:068c656f7ccaf94ced0945"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const mangaId = urlParams.get('id');

        if(mangaId) {
            db.collection("manga").doc(mangaId).get().then(doc => {
                if(doc.exists) {
                    const data = doc.data();
                    document.getElementById('mangaTitleDisplay').innerText = data.title;
                    document.getElementById('mangaDetails').innerHTML = `
                        <img src="${data.coverUrl}" class="w-48 h-64 object-cover rounded-xl border border-slate-700">
                        <div class="space-y-3">
                            <h2 class="text-3xl font-black text-white">${data.title}</h2>
                            <span class="bg-primary/20 text-primary border border-primary/30 px-3 py-1 rounded-full text-xs font-semibold inline-block">${data.genre}</span>
                            <p class="text-slate-300 text-sm leading-relaxed">${data.description || 'لا يوجد وصف محدد.'}</p>
                        </div>
                    `;
                }
            });
        }
    </script>
</body>
          </html>
