<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book X - لوحة التحكم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: '#6366F1', darkBg: '#0F172A', cardBg: '#1E293B' } } }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen p-6">

    <div class="max-w-5xl mx-auto space-y-8">
        <!-- Header -->
        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
            <h1 class="text-2xl font-black text-primary flex items-center gap-2">
                <i class="fa-solid fa-sliders"></i> لوحة إدارة الكتب (Book X)
            </h1>
            <a href="index.html" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl text-sm font-bold transition">العودة للمكتبة</a>
        </div>

        <!-- Add Book Form -->
        <div class="bg-cardBg p-6 rounded-2xl border border-slate-800 space-y-4">
            <h2 class="text-lg font-bold text-primary flex items-center gap-2">
                <i class="fa-solid fa-plus-circle"></i> إضافة كتاب أو رواية جديدة
            </h2>
            <form id="addBookForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="bookTitle" placeholder="عنوان الكتاب / الرواية" required class="bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm outline-none focus:border-primary">
                <input type="text" id="bookAuthor" placeholder="اسم الكاتب / المؤلف" required class="bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm outline-none focus:border-primary">
                
                <select id="bookCategory" class="bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm outline-none focus:border-primary text-slate-300">
                    <option value="روايات">روايات</option>
                    <option value="تنمية بشرية">تنمية بشرية</option>
                    <option value="تاريخ">تاريخ</option>
                    <option value="برمجة وتقنية">برمجة وتقنية</option>
                    <option value="علوم">علوم</option>
                    <option value="أخرى">أخرى</option>
                </select>

                <input type="url" id="bookCover" placeholder="رابط صورة الغلاف (Image URL)" required class="bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm outline-none focus:border-primary">
                <input type="url" id="bookPdfUrl" placeholder="رابط قراءة / تحميل الـ PDF" required class="bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm outline-none focus:border-primary col-span-full">
                
                <textarea id="bookDesc" placeholder="نبذة مختصرة عن الكتاب..." class="bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm outline-none focus:border-primary col-span-full h-24"></textarea>
                
                <button type="submit" class="bg-primary hover:opacity-90 text-white font-bold py-3 rounded-xl col-span-full transition">حفظ ونشر الكتاب</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCiHNEcRyiV9Siy5sB1dHTBcypMJMorF2Q",
          authDomain: "mangax-18232.firebaseapp.com",
          projectId: "mangax-18232",
          storageBucket: "mangax-18232.firebasestorage.app",
          messagingSenderId: "852304213792",
          appId: "1:852304213792:web:068c656f7ccaf94ced0945"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        document.getElementById('addBookForm').addEventListener('submit', (e) => {
            e.preventDefault();
            db.collection("books").add({
                title: document.getElementById('bookTitle').value,
                author: document.getElementById('bookAuthor').value,
                category: document.getElementById('bookCategory').value,
                coverUrl: document.getElementById('bookCover').value,
                pdfUrl: document.getElementById('bookPdfUrl').value,
                description: document.getElementById('bookDesc').value,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert("تمت إضافة الكتاب بنجاح إلى المكتبة!");
                document.getElementById('addBookForm').reset();
            }).catch(err => alert("حدث خطأ: " + err.message));
        });
    </script>
</body>
</html>
