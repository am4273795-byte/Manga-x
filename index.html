<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book X - مكتبة الكتب والروايات المجانية</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#6366F1', // لون أزرق نيلي جذاب للمكتبة
                        darkBg: '#0F172A',
                        cardBg: '#1E293B'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-50 dark:bg-darkBg text-slate-800 dark:text-slate-100 transition-colors duration-300 min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-white/80 dark:bg-cardBg/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <!-- Logo -->
            <a href="index.html" class="flex items-center gap-2 text-2xl font-black text-primary">
                <i class="fa-solid fa-book-bookmark"></i>
                <span>BOOK <span class="text-white bg-primary px-2 py-0.5 rounded-lg">X</span></span>
            </a>

            <!-- Search Bar -->
            <div class="hidden md:flex relative w-1/3">
                <input type="text" id="searchInput" onkeyup="searchBooks()" placeholder="ابحث عن كتاب أو كاتب..." class="w-full bg-slate-100 dark:bg-slate-800 border border-transparent focus:border-primary rounded-full py-2 px-4 pr-10 outline-none transition text-sm">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400"></i>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center gap-3">
                <button id="themeToggle" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 text-xl text-amber-500 dark:text-amber-400">
                    <i class="fa-solid fa-sun dark:hidden"></i>
                    <i class="fa-solid fa-moon hidden dark:block"></i>
                </button>
                <a href="admin.html" class="bg-primary hover:opacity-90 text-white font-bold py-2 px-4 rounded-xl text-sm transition shadow-lg shadow-primary/30">
                    لوحة التحكم
                </a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="relative bg-gradient-to-r from-indigo-900 to-slate-900 text-white py-16 px-4 mb-8 overflow-hidden">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-8 relative z-10">
            <div class="space-y-4 max-w-xl text-center md:text-right">
                <span class="bg-primary/20 text-primary border border-primary/30 px-3 py-1 rounded-full text-xs font-semibold">المكتبة الرقمية المجانية</span>
                <h1 class="text-3xl md:text-5xl font-extrabold leading-tight">آلاف الكتب والروايات بين يديك</h1>
                <p class="text-slate-300 text-base">اقرأ وحمّل أحدث الكتب والروايات مجاناً بصيغة PDF مجاناً وبدون إعلانات مزعجة.</p>
            </div>
            <div class="hidden md:block text-8xl text-primary/20">
                <i class="fa-solid fa-book-open text-primary"></i>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 flex-grow w-full mb-12">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
            <h2 class="text-2xl font-bold flex items-center gap-2 border-r-4 border-primary pr-3">
                أحدث الكتب المضافة
            </h2>
        </div>

        <!-- Books Grid -->
        <div id="booksGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
            <div class="animate-pulse bg-cardBg h-64 rounded-xl"></div>
            <div class="animate-pulse bg-cardBg h-64 rounded-xl"></div>
            <div class="animate-pulse bg-cardBg h-64 rounded-xl"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white dark:bg-cardBg border-t border-slate-200 dark:border-slate-800 py-6 text-center text-slate-500 text-sm">
        <p>جميع الحقوق محفوظة © 2026 لموقع <span class="text-primary font-bold">BOOK X</span></p>
    </footer>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <script src="app.js"></script>
</body>
                                                                                          </html>
